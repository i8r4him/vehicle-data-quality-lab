name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - name: Regressionstests
        run: python -m xmlrunner discover -s tests -o reports/unit -v
      - name: Abnahmetests
        if: ${{ !cancelled() }}
        run: python -m behave --junit --junit-directory reports/acceptance
      - run: python -m vehicle_data_quality demo --output reports/demo
      - run: python -m vehicle_data_quality.ai_review --output reports/demo/ai-review --response examples/ai-response.json
      - name: Testergebnisse und Demobericht
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-python-${{ matrix.python }}
          path: |
            reports/unit/*.xml
            reports/acceptance/*.xml
            reports/demo/**/*.json
            reports/demo/**/*.xlsx
            reports/demo/**/*.csv
